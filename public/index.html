<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Loonx Gift</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        /* Фикс отображения админки */
        #admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .admin-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .admin-tab { padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; text-align: center; border-radius: 8px; font-size: 12px; }
        .admin-tab.active { border-color: var(--neon); color: var(--neon); }
        
        /* Стили для баттл рулетки (canvas) */
        #br-canvas { background: #111; border-radius: 50%; border: 5px solid #222; margin: 20px auto; display: block; }
        .br-player-card { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #111; border-radius: 8px; margin-bottom: 5px; }
        
        /* История кошелька */
        .w-history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #222; font-size: 12px; }
        .approved { border-left: 3px solid var(--neon); }
        .pending { border-left: 3px solid #ffa500; }
        .rejected { border-left: 3px solid var(--neon-red); }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color:var(--neon); letter-spacing: 3px;">LOONX</h2>
    </div>

    <div id="toast-container"></div>
    <canvas id="stars-bg"></canvas>

    <header>
        <div class="h-left">
            <img src="" id="user-ava" class="avatar" onclick="checkAdmin()">
            <div>
                <div style="font-weight: 900; font-size: 15px; letter-spacing: 1px;">LOONX GIFT</div>
                <div style="font-size: 11px; color: var(--neon);">● Онлайн: <span id="online-c">0</span></div>
            </div>
        </div>
        <div style="text-align: right;">
            <div class="bal-wrap">
                <span id="bal-val">0.00</span>
                <svg class="ton-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.5l6.5 13h-13L12 5.5z"/></svg>
            </div>
            <div id="bal-mode" class="mode-btn" onclick="toggleMode()">REAL TON</div>
        </div>
    </header>

    <div class="content">
        <div id="page-home" class="page active">
            <div class="card" id="live-feed" style="font-size: 12px; max-height: 140px; overflow-y: auto;">
                <div id="feed-list"></div>
            </div>
            <div class="card game-card" onclick="navGame('crash')">🚀 CRASH</div>
            <div class="card game-card" onclick="navGame('mines')">💎 MINES</div>
            <div class="card game-card" onclick="navGame('coin')">🪙 COINFLIP</div>
            <div class="card game-card" onclick="navGame('battle')">⚔️ BATTLE RULLET</div>
        </div>

        <div id="page-crash" class="page">
            <div class="crash-screen">
                <div id="cr-history" class="cr-history"></div>
                <div id="cr-timer"></div>
                <div id="cr-x">1.00x</div>
            </div>
            <input type="number" id="cr-bet" class="input-box" placeholder="Ставка TON">
            <button id="cr-btn" class="btn" onclick="playCrash()">ПОСТАВИТЬ</button>
            <div id="cr-live-bets"></div>
        </div>

        <div id="page-mines" class="page">
            <div id="mine-grid" class="mines-grid"></div>
            <input type="number" id="mi-bet" class="input-box" placeholder="Ставка TON">
            <button id="mi-btn" class="btn" onclick="playMines()">ИГРАТЬ</button>
        </div>

        <div id="page-coin" class="page">
            <div class="coin-container"><div class="coin" id="coin-3d"><div class="c-face c-front">L</div><div class="c-face c-back">X</div></div></div>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button id="side-l" class="btn active" onclick="setSide('L')">L</button>
                <button id="side-x" class="btn" onclick="setSide('X')">X</button>
            </div>
            <input type="number" id="co-bet" class="input-box" placeholder="Ставка TON">
            <button id="co-btn" class="btn" onclick="playCoin()">КРУТИТЬ</button>
        </div>

        <div id="page-battle" class="page">
            <div id="br-lobby-list">
                <button class="btn" onclick="createBattleLobby()">СОЗДАТЬ БИТВУ</button>
                <div id="br-active-rooms" style="margin-top:15px;"></div>
            </div>
            <div id="br-game-view" style="display:none;">
                <div style="text-align:center;">
                    <div id="br-timer-display" style="font-size:24px; color:var(--neon);">02:00</div>
                    <div id="br-total-bank">0.00 T</div>
                </div>
                <canvas id="br-canvas" width="250" height="250"></canvas>
                <input type="number" id="br-bet-amount" class="input-box" placeholder="Доставить в банк">
                <button class="btn" onclick="joinBattleLobby()">СТАВКА</button>
                <div id="br-players-list" style="margin-top:15px;"></div>
                <button class="btn" style="background:#333;" onclick="$('br-game-view').style.display='none'; $('br-lobby-list').style.display='block'; currentLobbyId=null;">НАЗАД К СПИСКУ</button>
            </div>
        </div>

        <div id="page-wallet" class="page">
            <div class="card">
                <div class="w-tabs" style="display:flex; gap:5px; margin-bottom:10px;">
                    <div class="w-tab active" onclick="switchDepTab('manual', this)">Manual</div>
                    <div class="w-tab" onclick="switchDepTab('connect', this)">TonConnect</div>
                </div>
                <div id="dep-manual">
                    <div id="dep-wallet" style="word-break:break-all; font-size:10px; padding:10px; background:#111;"></div>
                    <div id="dep-memo" style="font-size:18px; color:var(--neon); text-align:center; margin:10px 0;"></div>
                    <button class="btn" onclick="checkRealDeposit(this)">ПРОВЕРИТЬ ОПЛАТУ</button>
                </div>
                <div id="dep-connect" style="display:none;">
                    <div id="ton-connect-btn"></div>
                    <input type="number" id="tc-amount" class="input-box" placeholder="Сумма TON">
                    <button class="btn" onclick="payWithTonConnect()">ПОПОЛНИТЬ</button>
                </div>
            </div>
            <div class="card">
                <input type="number" id="with-amount" class="input-box" placeholder="Сумма (мин 5)">
                <input type="text" id="with-addr" class="input-box" placeholder="Адрес (UQC...)">
                <button class="btn" onclick="withdraw()">ВЫВЕСТИ</button>
            </div>
            <div class="card">
                <div style="font-size:12px; color:var(--sub);">ИСТОРИЯ ДЕПОЗИТОВ</div>
                <div id="user-dep-history"></div>
                <div style="font-size:12px; color:var(--sub); margin-top:15px;">ИСТОРИЯ ВЫВОДОВ</div>
                <div id="w-history-list"></div>
            </div>
        </div>

        <div id="page-profile" class="page">
            <div class="card" style="display:flex; align-items:center; gap:15px;">
                <img src="" id="profile-ava" class="avatar" style="width:60px; height:60px;">
                <div>
                    <h2 id="profile-name">User</h2>
                    <div style="font-size:12px; color:var(--sub);">
                        Ставок: <span id="p-bets">0</span> | Вин: <span id="p-wins">0</span><br>
                        Профит: <span id="p-plus">0</span> | Минус: <span id="p-minus">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-promo" class="page">
            <div class="card">
                <input type="text" id="promo-code" class="input-box" placeholder="Введите промокод">
                <button class="btn" onclick="activatePromo()">АКТИВИРОВАТЬ</button>
            </div>
        </div>
    </div>

    <div id="admin-modal">
        <div style="display:flex; justify-content:space-around; margin-bottom:15px; background:#111; padding:10px; border-radius:10px;">
            <div style="text-align:center;">Dep: <br><span id="adm-total-dep" style="color:var(--neon);">0</span></div>
            <div style="text-align:center;">With: <br><span id="adm-total-with" style="color:var(--neon-red);">0</span></div>
            <div style="text-align:center;">Users: <br><span id="adm-u-count">0</span></div>
        </div>
        <div class="admin-tabs">
            <div class="admin-tab active" onclick="switchAdminTab('withdraws')">Выводы</div>
            <div class="admin-tab" onclick="switchAdminTab('promo')">Промо</div>
            <div class="admin-tab" onclick="switchAdminTab('rtp')">RTP/Тех</div>
            <div class="admin-tab" onclick="switchAdminTab('users')">Юзеры</div>
        </div>
        <div id="admin-content"></div>
        <button class="btn" style="background:var(--neon-red); margin-top:20px;" onclick="$('admin-modal').style.display='none'">ЗАКРЫТЬ</button>
    </div>

    <div class="hotbar">
        <div class="nav-item active" onclick="nav('home', this)">Игры</div>
        <div class="nav-item" onclick="nav('promo', this)">Промо</div>
        <div class="nav-item" onclick="nav('wallet', this)">Кошелек</div>
        <div class="nav-item" onclick="nav('profile', this)">Профиль</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
